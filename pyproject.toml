[project]
name = "otty-server"
version = "0.2.0"
description = "A small token-authenticated HTTP bridge to Otty"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.32,<1",
    "websockets>=14,<17",
]

[dependency-groups]
dev = [
    "uv>=0.13.3",
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
