name = "otty-gateway"
main = "worker.js"
compatibility_date = "2025-01-01"

# 直接复用 gateway/pwa 前端静态文件（Cloudflare 免费托管静态资源）
[assets]
directory = "../gateway/pwa"
binding = "ASSETS"

# 绑定 Durable Object（全局唯一实例中转中心）
[[durable_objects.bindings]]
name = "OTTY_HUB"
class_name = "OttyInstanceHub"

# Cloudflare 免费版（Free Plan）必须使用 new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OttyInstanceHub"]

[vars]
# 注册密钥（至少 16 位），本地运行 main.py 时需设置相同的 OTTY_GATEWAY_REGISTER_KEY
OTTY_GATEWAY_REGISTER_KEY = "otty-local-gateway-reg-key-2026"
# 可选：跨域白名单（逗号分隔，留空允许同源或任意 Origin）
OTTY_GATEWAY_CORS_ORIGINS = ""
# 语音输入（按住说话）使用的阿里云百炼 ASR 模型与专属请求地址
OTTY_ASR_MODEL = "qwen-audio-3.1-asr-flash"
OTTY_ASR_ENDPOINT = "https://llm-6b7p48qstpbrqpqn.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"

# 语音输入密钥请勿写在这里！在 Cloudflare 后台 Settings → Variables and Secrets
# 添加 Secret：DASHSCOPE_API_KEY，或执行：npx wrangler secret put DASHSCOPE_API_KEY
# 未配置 DASHSCOPE_API_KEY 时，/api/v1/asr 会转发给本地 Otty Server，由本地 .env 中的密钥识别。
